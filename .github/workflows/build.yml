# Builds the installers, then runs the smoke harness on the runner: the app is launched in smoke
# mode and driven with the real mouse (scripts/smoke/drive.ps1 + src/smoke), every read-only
# service is called against the real backend, every widget is rendered, the risky interactive
# paths are driven (typing, hotkey, Apps tile + Explorer, drags, auto-hide, full screen, live glass,
# taskbar modes, idle CPU, crash recovery), and the taskbar is checked on quit. Everything lands in the glintbar-smoke artifact; smoke/summary.md is the one file to read
# (also on the job summary page). Manual trigger only; releases are published from a run's installers.
name: Build

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Run the smoke harness after the build (about 8-10 minutes)"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # The self-test's list of Rust methods/topics (src/smoke/rust-ipc.json), fresh from the sources.
      - name: IPC manifest
        continue-on-error: true
        run: node scripts/check-ipc.mjs --write-manifest

      - name: Build installers
        run: npx tauri build --ci

      - name: Smoke drive
        id: smoke
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.smoke }}
        timeout-minutes: 14
        shell: pwsh
        env:
          GLINTBAR_SMOKE: "1"
          GLINTBAR_NO_CAPTURE_EXCLUDE: "1"
        run: ./scripts/smoke/drive.ps1 -Exe src-tauri/target/release/glintbar.exe -OutDir smoke -BudgetSec 600

      - name: Collect smoke files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          # Normally gone already (the driver quits it); never leave it running.
          Get-Process -Name glintbar -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA/GlintBar/smoke/*" smoke/ -Exclude *.tmp -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA/GlintBar/logs/*" smoke/ -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA/GlintBar/*.json" smoke/ -ErrorAction SilentlyContinue
          Get-ChildItem smoke | Format-Table Name, Length
          if (Test-Path smoke/glintbar.log) { Get-Content smoke/glintbar.log -Tail 60 }

      - name: Smoke summary
        if: always()
        shell: bash
        run: node scripts/smoke/summarize.mjs smoke --step-summary > /dev/null

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glintbar-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glintbar-smoke
          path: smoke/
          if-no-files-found: warn
