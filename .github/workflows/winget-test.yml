name: winget manifest test

# Manual only. Validates and installs the winget manifest of one version on a Windows runner.
# The manifest is read from the submission branch of the winget-pkgs fork.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version whose manifest to test (for example 0.1.4)
        required: true

jobs:
  winget:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Silent run of the setup program (diagnosis)
        shell: pwsh
        timeout-minutes: 6
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "setup.exe"
          Invoke-WebRequest -Uri "https://github.com/candiesdoodle/glintbar/releases/download/v$env:VERSION/GlintBar_$($env:VERSION)_x64-setup.exe" -OutFile $setup
          $guid = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          foreach ($k in "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid", "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid", "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid") {
            $pv = (Get-ItemProperty -Path $k -Name pv -ErrorAction SilentlyContinue).pv
            Write-Host "WebView2 pv at $k : '$pv'"
          }
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -PassThru
          $deadline = (Get-Date).AddSeconds(150)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            Write-Host "--- $(Get-Date -Format HH:mm:ss) setup running: $(-not $p.HasExited)"
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -gt (Get-Date).AddMinutes(-4) -and $_.Name -notmatch 'conhost|pwsh|powershell|svchost|WmiPrvSE' } |
              ForEach-Object { Write-Host ("  {0} pid={1} parent={2} cmd={3}" -f $_.Name, $_.ProcessId, $_.ParentProcessId, ("" + $_.CommandLine).Substring(0, [Math]::Min(160, ("" + $_.CommandLine).Length))) }
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host ("  window: {0} '{1}'" -f $_.ProcessName, $_.MainWindowTitle) }
          }
          if (-not $p.HasExited) {
            Write-Host "setup did not finish in 150 s; stopping it"
            Get-Process -Name "setup", "MicrosoftEdgeWebview2Setup", "MicrosoftEdgeUpdate", "glintbar" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "the setup program hangs in silent mode"
          }
          Write-Host "setup exit code: $($p.ExitCode)"
          $exe = Join-Path $env:LOCALAPPDATA "GlintBar\glintbar.exe"
          Write-Host "installed: $(Test-Path $exe)"
          $un = Join-Path $env:LOCALAPPDATA "GlintBar\uninstall.exe"
          if (Test-Path $un) { $u = Start-Process -FilePath $un -ArgumentList "/S" -PassThru; $u.WaitForExit(90000) | Out-Null; Start-Sleep 5; Write-Host "after uninstall, exe present: $(Test-Path $exe)" }
      - name: Validate and install
        timeout-minutes: 8
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe
            Start-Sleep -Seconds 5
          }
          winget --version
          $dir = Join-Path $env:RUNNER_TEMP "manifest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $base = "https://raw.githubusercontent.com/candiesdoodle/winget-pkgs/GlintBar.GlintBar-$env:VERSION/manifests/g/GlintBar/GlintBar/$env:VERSION"
          foreach ($f in "GlintBar.GlintBar.installer.yaml", "GlintBar.GlintBar.locale.en-US.yaml", "GlintBar.GlintBar.yaml") {
            Invoke-WebRequest -Uri "$base/$f" -OutFile (Join-Path $dir $f)
          }
          Write-Host "== winget validate"
          winget validate --manifest $dir
          # -1978335192 is "validation succeeded with warnings".
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335192) { throw "winget validate failed with exit code $LASTEXITCODE" }
          Write-Host "== winget install"
          winget settings --enable LocalManifestFiles
          $w = Start-Process -FilePath winget -ArgumentList @("install", "--manifest", $dir, "--silent", "--accept-package-agreements", "--accept-source-agreements", "--disable-interactivity", "--verbose-logs") -PassThru -NoNewWindow
          $t0 = Get-Date
          while (-not $w.HasExited -and ((Get-Date) - $t0).TotalSeconds -lt 150) {
            Start-Sleep -Seconds 15
            Write-Host "--- $(Get-Date -Format HH:mm:ss) winget running: $(-not $w.HasExited)"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'setup|glintbar|winget|WindowsPackageManager|AppInstaller|Edge|msiexec|uninstall' } |
              ForEach-Object { Write-Host ("  {0} pid={1} parent={2} cmd={3}" -f $_.Name, $_.ProcessId, $_.ParentProcessId, ("" + $_.CommandLine).Substring(0, [Math]::Min(200, ("" + $_.CommandLine).Length))) }
          }
          if (-not $w.HasExited) {
            $log = Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
            if ($log) { Write-Host "== tail of $($log.Name)"; Get-Content $log.FullName -Tail 45 }
            Write-Host "installed so far: $(Test-Path (Join-Path $env:LOCALAPPDATA 'GlintBar\glintbar.exe'))"
            Get-Process -Name "winget", "WindowsPackageManagerServer", "glintbar" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.Path -like "*WinGet*setup*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "winget install did not finish in 150 s"
          }
          if ($w.ExitCode -ne 0) { throw "winget install failed with exit code $($w.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "GlintBar\glintbar.exe"
          if (-not (Test-Path $exe)) { throw "glintbar.exe is missing at $exe" }
          Write-Host "installed version: $((Get-Item $exe).VersionInfo.ProductVersion)"
          Write-Host "== winget list"
          winget list --name GlintBar --accept-source-agreements --disable-interactivity
          Write-Host "== winget uninstall"
          winget uninstall --manifest $dir --silent --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget uninstall failed with exit code $LASTEXITCODE" }
          if (Test-Path $exe) { throw "glintbar.exe is still there after the uninstall" }
